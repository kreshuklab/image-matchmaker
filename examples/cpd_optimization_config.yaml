fixed_image:
  path: "data/test_elastic_registration/fixed_image.n5"
  input_key: "input"
  # Key written by add_landmarks.py (svd_prealignment with landmarks embedded)
  aligned_key: "svd_prealignment_with_lm"
  x_res: 1.0
  y_res: 1.0
  z_res: 1.0

moving_image:
  path: "data/test_elastic_registration/moving_image.n5"
  input_key: "input"
  # Key written by add_landmarks.py (rigid_alignment with landmarks embedded)
  aligned_key: "rigid_alignment_with_lm"
  x_res: 1.0
  y_res: 1.0
  z_res: 1.0

prealignment_transform: "data/test_elastic_registration/svd_prealignment/svd_prealignment_transform.json"
rigid_transform: "data/test_elastic_registration/rigid_alignment/TransformParameters.0.txt"

landmarks:
  fixed: "examples/data/fixed_landmarks.csv"
  moving: "examples/data/moving_landmarks.csv"

log_dir: "data/test_elastic_registration/cpd_optimization"

optuna:
  study_name: "cpd_optimization"
  # GridSampler will run all combinations: 4 x 3 x 3 x 2 = 72 trials
  # Switch to a different sampler in cpd_optimization.py for non-exhaustive search
  search_space:
    w: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
    beta: [50.0, 100.0, 200.0]
    lmd: [0.01, 0.1, 1.0]
    maxiter: [100, 150]
