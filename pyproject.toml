[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "image-matchmaker"
version = "0.1.0"
description = "Tool for segmentation-based deformable registration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Elena Buglakova" }
]

dependencies = [
    "click",
    "cvxpy",
    "itk-elastix",
    "matplotlib",
    "numpy",
    "open3d",
    "optuna",
    "pandas",
    "probreg",
    "pyyaml",
    "scikit-image",
    "scipy",
    "seaborn",
    "snakemake",
    "tifffile",
    "transforms3d",
    "z5py",
]


[project.scripts]
image-matchmaker = "image_matchmaker.cli:main"


[project.urls]
Homepage = "https://github.com/kreshuklab/image-matchmaker"
Documentation = "https://image-matchmaker.readthedocs.io/"
Repository = "https://github.com/kreshuklab/image-matchmaker"
Issues = "https://github.com/kreshuklab/image-matchmaker/issues"


[tool.setuptools.packages.find]
include = ["image_matchmaker*"]


[tool.setuptools.package-data]
image_matchmaker = [
  "**/*.yaml",
  "**/*.smk",
  "**/*.txt",
]
