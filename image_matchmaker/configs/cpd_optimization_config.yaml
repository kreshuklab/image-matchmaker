fixed_image:
  # name: "fixed_image"   # optional, names the working .n5 written to log_dir
  path: "data/test_elastic_registration/fixed_image.n5"
  input_key: "input"
  aligned_key: "svd_prealignment_with_lm"
  x_res: 1.0
  y_res: 1.0
  z_res: 1.0

moving_image:
  # name: "moving_image"  # optional, names the working .n5 written to log_dir
  path: "data/test_elastic_registration/moving_image.n5"
  input_key: "input"
  aligned_key: "rigid_alignment_with_lm"
  x_res: 1.0
  y_res: 1.0
  z_res: 1.0

landmarks:
  fixed: "example_data/fixed_landmarks.csv"
  moving: "example_data/moving_landmarks.csv"

prealignment:
  axis_orientation: "auto"

log_dir: "data/test_elastic_registration/cpd_optimization"

optuna:
  study_name: "cpd_optimization"
  # search_space controls which parameter ranges are used. Three options:
  #
  #   "default"          — load ranges from default_cpd_ranges.yaml
  #   "dataset-specific" — compute beta from the extent of the aligned fixed point cloud
  #                        (suggest_beta_ranges, called in-process at the start of the
  #                        search, not a separate step); other params from defaults
  #   explicit dict      — specify ranges directly, e.g.:
  #
  # search_space:
  #   w: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
  #   beta: [50.0, 100.0, 200.0]
  #   lmd: [0.01, 0.1, 1.0]
  #   maxiter: [150]
  search_space: "default"
  # Trials evaluated in parallel. Each worker runs a full CPD fit, so both runtime and
  # memory scale with it. Run snakemake with --cores >= n_jobs, or the search is capped.
  n_jobs: 1
