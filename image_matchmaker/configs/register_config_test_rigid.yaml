fixed_image:
  source_path: "example_data/platy1_muscles_stardist_fixed.tif"
  path: "example_data/deformed_data/platy1_muscles_stardist_fixed_rotated.tif"
  x_res: 1
  y_res: 1
  z_res: 1

moving_image:
  path: "example_data/deformed_data/platy1_muscles_stardist_rigid.tif"
  x_res: 1
  y_res: 1
  z_res: 1
  ref_path: "example_data/test_data/moving_pointset_aligned.tif"
  ref_url: "https://github.com/kreshuklab/image-matchmaker/releases/download/test_data-v1.0/moving_pointset_aligned.tif"

log_dir: "data/test_rigid_registration"

prealignment:
  axis_orientation: "auto"

coherent_point_drift:
  w: 0.00001
  lmd: 0.1
  beta: 100
  maxiter: 10 # Low for debugging purpose, should be 100-150

matching:
  method: ilp        # ilp | hungarian | sinkhorn
  min_neighbours: 10
  max_dist: 30

mobie_export: False
semantic_seg: True
mobie_dataset_name: "platy1_muscles_stardist"
